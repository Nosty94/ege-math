<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#070c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ЕГЭ Мат">
<meta name="description" content="Все формулы ЕГЭ Математика профиль 2026 — карточки, тесты, прогресс">
<title>ЕГЭ Математика Профиль 2026</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23070c1a'/%3E%3Ctext y='.9em' font-size='75' text-anchor='middle' x='50'%3E📐%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070c1a;--bg2:#0c1225;--bg3:#131b33;--bg4:#1a2340;
  --card:rgba(255,255,255,0.035);--card-h:rgba(255,255,255,0.065);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --text:#dde4f8;--text2:#7a8aa8;--text3:#4a5a78;
  --alg:#4a9eff;--trig:#b47bff;--plan:#34d08c;--ster:#ff6b4a;--prob:#ffc542;
  --fav:#ffd700;--ex-c:#52c77a;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Outfit',system-ui,sans-serif;
  min-height:100vh;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── HEADER ── */
#hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(7,12,26,0.97);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:10px 14px 0;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
}
.hdr-top{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;
}
.app-name{font-size:16px;font-weight:700;letter-spacing:0.3px;flex:1;}
.app-badge{
  font-size:10px;background:rgba(74,158,255,0.15);
  color:var(--alg);border:1px solid rgba(74,158,255,0.3);
  border-radius:20px;padding:2px 8px;letter-spacing:0.5px;white-space:nowrap;
}
.mode-btn{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);border-radius:8px;
  padding:6px 10px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;transition:all 0.18s;
  font-family:'Outfit',sans-serif;font-weight:500;
  min-height:34px;min-width:44px;justify-content:center;
}
.mode-btn:hover,.mode-btn:active{background:var(--bg4);color:var(--text);}

.srch-row{position:relative;margin-bottom:10px;}
#srch{
  width:100%;padding:10px 16px 10px 40px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:24px;color:var(--text);
  font-size:15px;font-family:'Outfit',sans-serif;
  outline:none;transition:border-color 0.2s;
  -webkit-appearance:none;appearance:none;
}
#srch:focus{border-color:var(--alg);}
#srch::placeholder{color:var(--text2);}
.srch-ico{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--text2);font-size:15px;pointer-events:none;
}

/* ── TABS ── */
.tabs-wrap{position:relative;}
#tabs{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  padding-bottom:0;-webkit-overflow-scrolling:touch;
}
#tabs::-webkit-scrollbar{display:none;}
.tabs-fade-right{
  position:absolute;right:0;top:0;bottom:0;
  width:64px;
  background:linear-gradient(to right,transparent,rgba(7,12,26,0.97));
  pointer-events:none;
  transition:opacity 0.2s;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px;
}
.tabs-fade-right::after{
  content:'›';
  font-size:22px;font-weight:700;
  color:rgba(180,180,255,0.7);
  animation:pulse-arr 1.4s ease-in-out infinite;
}
@keyframes pulse-arr{
  0%,100%{opacity:0.3;transform:translateX(0);}
  50%{opacity:1;transform:translateX(5px);}
}
body.light .tabs-fade-right{
  background:linear-gradient(to right,transparent,rgba(240,244,255,0.97));
}
body.light .tabs-fade-right::after{color:rgba(60,80,180,0.6);}
.tab{
  flex-shrink:0;padding:9px 12px 11px;
  font-size:12.5px;font-weight:500;font-family:'Outfit',sans-serif;
  cursor:pointer;background:transparent;border:none;color:var(--text2);
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all 0.18s;
  min-height:44px;
}
.tab .ti{font-size:14px;}
.tab:hover{color:var(--text);}
.tab.active{color:#fff;font-weight:600;}
.tab[data-id="algebra"].active{color:var(--alg);border-bottom-color:var(--alg);}
.tab[data-id="trig"].active{color:var(--trig);border-bottom-color:var(--trig);}
.tab[data-id="plan"].active{color:var(--plan);border-bottom-color:var(--plan);}
.tab[data-id="ster"].active{color:var(--ster);border-bottom-color:var(--ster);}
.tab[data-id="prob"].active{color:var(--prob);border-bottom-color:var(--prob);}
.tab[data-id="fav"].active{color:var(--fav);border-bottom-color:var(--fav);}
.tab .fav-cnt{
  background:rgba(255,215,0,0.2);color:var(--fav);
  border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;
  display:none;
}
.tab .fav-cnt.has{display:inline;}

/* ── CONTENT ── */
#content{
  max-width:820px;margin:0 auto;
  padding:16px 14px 80px;
}

/* ── PROGRESS BAR ── */
.prog-bar-wrap{
  background:rgba(255,255,255,0.04);border-radius:8px;
  overflow:hidden;height:5px;margin-top:8px;
}
.prog-bar{height:100%;border-radius:8px;transition:width 0.4s ease;min-width:0;}
.prog-label{font-size:11px;color:var(--text3);margin-top:4px;text-align:right;}

/* ── SECTION INTRO ── */
.s-intro{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  margin-bottom:18px;font-size:13px;color:var(--text2);
  line-height:1.6;
}
.s-intro-top{display:flex;gap:12px;align-items:center;}
.s-intro-icon{font-size:28px;flex-shrink:0;}
.s-intro-text b{color:var(--text);}

/* ── SUBSECTION ── */
.sub-hdr{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
.sub-title{
  font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
  font-weight:700;white-space:nowrap;padding:3px 10px;border-radius:20px;
}
.sub-line{flex:1;height:1px;background:var(--border);}
.sub-count{font-size:11px;color:var(--text3);white-space:nowrap;}

/* ── FORMULA CARD ── */
.fc{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;
  overflow:hidden;transition:border-color 0.2s,box-shadow 0.2s;
  border-left-width:3px;
}
.fc:hover{border-color:var(--border2);box-shadow:0 4px 24px rgba(0,0,0,.35);}
.fc[data-s="algebra"]{border-left-color:var(--alg);}
.fc[data-s="trig"]{border-left-color:var(--trig);}
.fc[data-s="plan"]{border-left-color:var(--plan);}
.fc[data-s="ster"]{border-left-color:var(--ster);}
.fc[data-s="prob"]{border-left-color:var(--prob);}
.fc.is-learned{opacity:0.65;}
.fc.is-learned .fc-title::after{
  content:'✓';margin-left:6px;color:var(--ex-c);font-size:11px;
}

.fc-head{
  padding:11px 12px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
}
.fc-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.8px;color:var(--text2);line-height:1.4;flex:1;
  padding-top:1px;
}
.fc-actions{display:flex;gap:4px;flex-shrink:0;}
.fc-btn{
  background:none;border:none;cursor:pointer;
  padding:4px 6px;border-radius:6px;font-size:16px;
  transition:all 0.15s;opacity:0.45;line-height:1;
  min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;
}
.fc-btn:hover,.fc-btn:active{opacity:1;background:rgba(255,255,255,0.07);}
.fc-btn.fav-btn.active{opacity:1;filter:drop-shadow(0 0 4px var(--fav));}
.fc-btn.learn-btn.active{opacity:1;color:var(--ex-c);}

.fc-math{
  padding:10px 16px 4px;
  text-align:center;font-size:1.1em;
  overflow-x:auto;font-family:'Crimson Pro',Georgia,serif;
  -webkit-overflow-scrolling:touch;
}
.fc-math::-webkit-scrollbar{height:3px;}
.fc-math::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.fc-desc{padding:2px 16px 12px;font-size:13px;color:var(--text2);line-height:1.55;}
.fc-svg{padding:4px 16px 10px;display:flex;justify-content:center;}
.fc-svg svg{max-width:100%;max-height:150px;width:auto;}

/* Example */
.ex-btn{
  width:100%;padding:10px 16px;
  background:rgba(255,255,255,0.025);border:none;
  border-top:1px solid var(--border);
  color:var(--ex-c);font-size:12px;font-weight:600;
  text-align:left;cursor:pointer;font-family:'Outfit',sans-serif;
  letter-spacing:0.4px;display:flex;align-items:center;gap:6px;
  transition:background 0.15s;min-height:40px;
}
.ex-btn:hover,.ex-btn:active{background:rgba(82,199,124,0.07);}
.ex-btn .arr{transition:transform 0.2s;display:inline-block;font-size:10px;}
.ex-btn.open .arr{transform:rotate(90deg);}
.ex-body{display:none;padding:12px 16px;background:rgba(82,199,124,0.04);border-top:1px solid rgba(82,199,124,0.12);}
.ex-body.open{display:block;}
.ex-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ex-c);font-weight:700;margin-bottom:6px;}
.ex-p{font-size:14px;font-family:'Crimson Pro',Georgia,serif;overflow-x:auto;margin-bottom:6px;line-height:1.7;-webkit-overflow-scrolling:touch;}
.ex-sep{height:1px;background:rgba(82,199,124,0.2);margin:8px 0;}
.ex-lbl2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--alg);font-weight:700;margin-bottom:6px;}
.ex-s{font-size:14px;font-family:'Crimson Pro',Georgia,serif;color:var(--text);overflow-x:auto;line-height:1.8;-webkit-overflow-scrolling:touch;}

/* ── TABLE CARDS ── */
.tbl-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;border-left:3px solid var(--trig);}
.tbl-head{padding:11px 16px;background:rgba(255,255,255,0.03);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text2);border-bottom:1px solid var(--border);}
.tbl-wrap{overflow-x:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;}
.trig-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;font-family:'Crimson Pro',Georgia,serif;}
.trig-tbl th{background:rgba(180,123,255,0.12);color:var(--trig);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:8px 5px;border:1px solid rgba(180,123,255,0.2);font-family:'Outfit',sans-serif;font-weight:700;}
.trig-tbl td{padding:8px 5px;text-align:center;border:1px solid var(--border);color:var(--text);font-size:13px;}
.trig-tbl tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.trig-tbl .ang{color:var(--trig);font-weight:600;}
.trig-tbl .undef{color:var(--text3);font-style:italic;font-size:11px;}
.deriv-tbl{width:100%;border-collapse:collapse;font-size:13px;font-family:'Crimson Pro',Georgia,serif;}
.deriv-tbl th{background:rgba(74,158,255,0.1);color:var(--alg);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:8px 12px;border:1px solid rgba(74,158,255,0.2);font-family:'Outfit',sans-serif;font-weight:700;}
.deriv-tbl td{padding:8px 12px;border:1px solid var(--border);color:var(--text);text-align:center;}
.deriv-tbl tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.props-tbl{width:100%;border-collapse:collapse;font-size:12px;font-family:'Crimson Pro',Georgia,serif;}
.props-tbl th{background:rgba(180,123,255,0.1);color:var(--trig);font-size:11px;padding:7px 10px;border:1px solid rgba(180,123,255,0.2);font-family:'Outfit',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.props-tbl td{padding:7px 10px;border:1px solid var(--border);color:var(--text);text-align:center;}
.props-tbl tr:nth-child(even) td{background:rgba(255,255,255,0.02);}

/* ── SEARCH INFO / EMPTY ── */
#srch-info{font-size:12px;color:var(--text2);padding:4px 0 8px;letter-spacing:0.3px;}
.empty{text-align:center;padding:64px 16px;color:var(--text2);}
.empty .em{font-size:40px;margin-bottom:12px;}
.empty p{font-size:14px;}

/* ── BACK TOP ── */
#bktop{
  position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:16px;
  width:48px;height:48px;border-radius:50%;
  background:var(--alg);border:none;
  color:#fff;font-size:20px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;box-shadow:0 4px 20px rgba(74,158,255,0.45);
  transform:translateY(16px) scale(0.85);
  transition:opacity 0.25s,transform 0.25s;z-index:300;
  -webkit-tap-highlight-color:transparent;
}
#bktop.vis{opacity:1;pointer-events:all;transform:translateY(0) scale(1);}
#bktop:hover{background:#3a8ef0;}

/* ── KATEX ── */
.katex{color:var(--text) !important;}
.katex-display{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}

/* ══════════════════════════════════════════
   FLASHCARD MODAL
══════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(7,12,26,0.96);
  display:flex;flex-direction:column;
  overflow:hidden;
  padding:0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.modal-overlay.hidden{display:none;}
.modal-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-title{font-size:15px;font-weight:700;}
.modal-close{
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);border-radius:8px;
  padding:7px 12px;font-size:13px;cursor:pointer;
  font-family:'Outfit',sans-serif;min-height:36px;
}
.modal-close:hover{background:var(--bg4);}

/* FLASHCARD */
.fc-modal-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:16px;gap:16px;overflow:hidden;
}
.fc-scene{
  width:100%;max-width:500px;
  aspect-ratio:3/2;
  perspective:1000px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.fc-card-inner{
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  position:relative;border-radius:16px;
}
.fc-scene.flipped .fc-card-inner{transform:rotateY(180deg);}
.fc-card-face{
  position:absolute;inset:0;
  border-radius:16px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:24px 20px;gap:10px;
  border:1px solid var(--border2);
}
.fc-front{background:var(--bg2);}
.fc-back{background:var(--bg3);transform:rotateY(180deg);}
.fc-section-badge{
  font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
  font-weight:700;padding:3px 10px;border-radius:20px;
  background:rgba(255,255,255,0.07);
}
.fc-question{
  font-size:18px;font-weight:600;text-align:center;line-height:1.4;
  color:var(--text);
}
.fc-hint{font-size:12px;color:var(--text3);margin-top:4px;}
.fc-formula{
  font-family:'Crimson Pro',Georgia,serif;
  font-size:1.25em;text-align:center;
  overflow-x:auto;max-width:100%;
  -webkit-overflow-scrolling:touch;
}
.fc-answer-label{
  font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text2);font-weight:700;
}

.fc-nav{
  display:flex;align-items:center;gap:12px;
  width:100%;max-width:500px;
}
.fc-nav-btn{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  border-radius:10px;padding:12px 20px;font-size:18px;cursor:pointer;
  min-height:48px;min-width:56px;transition:all 0.15s;
  display:flex;align-items:center;justify-content:center;
}
.fc-nav-btn:hover,.fc-nav-btn:active{background:var(--bg4);}
.fc-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
.fc-counter{
  flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--text2);
}
.fc-shuffle-btn{
  background:none;border:none;color:var(--text2);
  font-size:20px;cursor:pointer;padding:8px;
  min-height:44px;min-width:44px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;transition:all 0.15s;
}
.fc-shuffle-btn:hover{color:var(--text);background:rgba(255,255,255,0.05);}
.fc-fav-filter{
  background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.25);
  color:var(--fav);border-radius:8px;
  padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:'Outfit',sans-serif;min-height:36px;transition:all 0.15s;
}
.fc-fav-filter.active{background:rgba(255,215,0,0.2);}
.fc-top-controls{
  display:flex;gap:8px;width:100%;max-width:500px;justify-content:flex-end;
}

/* ══════════════════════════════════════════
   TEST MODAL
══════════════════════════════════════════ */
.test-body{
  flex:1;overflow-y:auto;padding:16px;
  -webkit-overflow-scrolling:touch;
}
.test-progress-bar{
  height:4px;background:var(--bg3);border-radius:2px;
  margin-bottom:20px;overflow:hidden;
}
.test-progress-fill{height:100%;border-radius:2px;background:var(--alg);transition:width 0.3s;}
.test-q-num{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:0.5px;margin-bottom:12px;}
.test-formula-wrap{
  background:var(--bg2);border:1px solid var(--border2);border-radius:12px;
  padding:24px 16px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;
  min-height:100px;
  font-family:'Crimson Pro',Georgia,serif;font-size:1.2em;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.test-section-hint{
  font-size:11px;text-align:center;margin-bottom:16px;
  font-weight:600;text-transform:uppercase;letter-spacing:0.8px;
}
.test-options{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.test-opt{
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:10px;padding:14px 16px;cursor:pointer;
  font-size:14px;font-family:'Outfit',sans-serif;color:var(--text);
  text-align:left;transition:all 0.18s;line-height:1.4;
  min-height:50px;width:100%;
}
.test-opt:hover,.test-opt:active{background:var(--bg4);}
.test-opt.correct{background:rgba(52,208,140,0.15);border-color:var(--plan);color:var(--plan);}
.test-opt.wrong{background:rgba(255,107,74,0.12);border-color:var(--ster);color:var(--ster);}
.test-opt:disabled{cursor:not-allowed;}
.test-next-btn{
  width:100%;background:var(--alg);color:#fff;border:none;
  border-radius:10px;padding:14px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;
  min-height:50px;transition:opacity 0.15s;
}
.test-next-btn:hover{opacity:0.9;}
.test-next-btn.hidden{display:none;}

/* Score screen */
.test-score-wrap{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:32px 16px;text-align:center;
}
.test-score-circle{
  width:110px;height:110px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid var(--plan);
  background:rgba(52,208,140,0.08);
}
.test-score-num{font-size:32px;font-weight:700;color:var(--plan);}
.test-score-label{font-size:12px;color:var(--text2);}
.test-score-msg{font-size:16px;font-weight:600;max-width:300px;line-height:1.4;}
.test-restart-btn{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  border-radius:10px;padding:13px 28px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;min-height:48px;
}

/* ── MOBILE TWEAKS ── */
@media(max-width:480px){
  .fc-math{font-size:0.95em;}
  .app-name{font-size:14px;}
  .mode-btn span.label{display:none;}
  .fc-question{font-size:16px;}
  .test-formula-wrap{font-size:1.05em;padding:16px 12px;}
  .test-opt{font-size:13px;padding:12px 14px;}
  #content{padding-left:10px;padding-right:10px;}
  .fc-card-face{padding:16px 14px;}
  .fc-formula{font-size:1.1em;}
}
@media(max-width:360px){
  .app-name{font-size:13px;}
  .tab{font-size:11px;padding:9px 9px 11px;}
  .fc-question{font-size:14px;}
}
@media(prefers-reduced-motion:reduce){
  .fc-card-inner{transition:none;}
  *{transition-duration:0.01ms !important;}
}

/* ── AUTO-HIDE HEADER ── */
#hdr{
  transition:transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94);
  will-change:transform;
}
#hdr.hdr-hidden{transform:translateY(-100%);}

/* ── SUBTOPIC CHIPS ── */
.subtopic-nav{
  display:flex;gap:6px;flex-wrap:nowrap;
  overflow-x:auto;scrollbar-width:none;
  padding:0 2px 16px;
  -webkit-overflow-scrolling:touch;
}
.subtopic-nav::-webkit-scrollbar{display:none;}
.st-chip{
  flex-shrink:0;padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--border2);background:var(--bg3);
  color:var(--text2);transition:all 0.15s;white-space:nowrap;
  font-family:'Outfit',sans-serif;min-height:34px;
  -webkit-tap-highlight-color:transparent;
}
.st-chip:hover,.st-chip:active{background:var(--bg4);color:var(--text);}

/* ── DETAILED SOLUTION STEPS ── */
.sol-btn{
  width:100%;padding:9px 16px;
  background:rgba(74,158,255,0.04);border:none;
  border-top:1px solid rgba(74,158,255,0.12);
  color:var(--alg);font-size:12px;font-weight:600;
  text-align:left;cursor:pointer;font-family:'Outfit',sans-serif;
  letter-spacing:0.4px;display:flex;align-items:center;gap:6px;
  transition:background 0.15s;min-height:40px;
}
.sol-btn:hover,.sol-btn:active{background:rgba(74,158,255,0.09);}
.sol-btn .arr{transition:transform 0.2s;font-size:10px;display:inline-block;}
.sol-btn.open .arr{transform:rotate(90deg);}
.sol-body{
  display:none;padding:12px 16px 14px;
  background:rgba(74,158,255,0.03);
  border-top:1px solid rgba(74,158,255,0.08);
}
.sol-body.open{display:block;}
.sol-step{
  display:flex;gap:10px;align-items:flex-start;
  margin-bottom:9px;font-size:13px;line-height:1.55;color:var(--text);
}
.sol-step:last-child{margin-bottom:0;}
.sol-num{
  min-width:22px;height:22px;border-radius:50%;
  background:rgba(74,158,255,0.18);color:var(--alg);
  font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;
}
.sol-formula{
  font-family:'Crimson Pro',Georgia,serif;font-size:1.05em;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
}

/* ── SEARCH HIGHLIGHT ── */
mark{background:rgba(255,197,66,0.3);color:inherit;border-radius:2px;}

/* ── LIGHT THEME ── */
body.light{
  --bg:#f0f4ff;--bg2:#e6ecfa;--bg3:#dde5f7;--bg4:#d0daef;
  --card:rgba(0,0,0,0.04);--card-h:rgba(0,0,0,0.07);
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --text:#1a2340;--text2:#4a5a78;--text3:#8a9ab8;
}
body.light #hdr{background:rgba(240,244,255,0.97);}
body.light .modal-overlay{background:rgba(240,244,255,0.98);}
body.light .fc-front{background:var(--bg2);}
body.light .fc-back{background:var(--bg3);}
body.light .test-opt{background:var(--bg3);}
body.light .test-opt:hover{background:var(--bg4);}

/* ── FONT SIZE CONTROL ── */
:root{--fs:1em;}
.fc-math{font-size:calc(1.1em * var(--fs-mul, 1));}
.katex-display{font-size:calc(1em * var(--fs-mul, 1));}

/* ── SETTINGS BAR ── */
.settings-bar{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px 8px;
  border-top:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
.settings-bar::-webkit-scrollbar{display:none;}
.set-btn{
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);border-radius:8px;
  padding:5px 10px;font-size:12px;cursor:pointer;
  white-space:nowrap;font-family:'Outfit',sans-serif;
  min-height:32px;transition:all 0.15s;flex-shrink:0;
}
.set-btn:hover,.set-btn:active{background:var(--bg4);color:var(--text);}
.set-btn.active{background:rgba(74,158,255,0.15);color:var(--alg);border-color:rgba(74,158,255,0.3);}

/* ── COUNTDOWN TIMER ── */
.countdown-wrap{
  display:flex;align-items:center;gap:8px;
  background:rgba(74,158,255,0.06);
  border:1px solid rgba(74,158,255,0.15);border-radius:8px;
  padding:6px 12px;margin-bottom:8px;
}
.countdown-label{font-size:11px;color:var(--text2);font-weight:600;letter-spacing:0.3px;}
.countdown-num{font-size:18px;font-weight:700;color:var(--alg);line-height:1;}
.countdown-unit{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:0.3px;}
.countdown-block{display:flex;flex-direction:column;align-items:center;gap:1px;}
.countdown-sep{font-size:15px;font-weight:700;color:var(--text3);padding-bottom:6px;}

/* ── NOTES ── */
.note-btn{
  background:none;border:none;cursor:pointer;
  padding:4px 6px;border-radius:6px;font-size:14px;
  transition:all 0.15s;opacity:0.4;line-height:1;
  min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;
}
.note-btn:hover,.note-btn:active{opacity:1;background:rgba(255,255,255,0.07);}
.note-btn.has-note{opacity:1;color:var(--prob);}
.note-area{
  display:none;padding:10px 16px 12px;
  border-top:1px solid var(--border);
  background:rgba(255,197,66,0.04);
}
.note-area.open{display:block;}
.note-area textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  color:var(--text);border-radius:8px;padding:8px 12px;
  font-size:13px;font-family:'Outfit',sans-serif;
  resize:none;outline:none;min-height:68px;line-height:1.5;
  transition:border-color 0.2s;
}
.note-area textarea:focus{border-color:var(--prob);}
.note-save-btn{
  margin-top:6px;background:rgba(255,197,66,0.15);
  border:1px solid rgba(255,197,66,0.3);color:var(--prob);
  border-radius:7px;padding:6px 14px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;
}
.note-save-btn:hover{background:rgba(255,197,66,0.25);}

/* ── STATS MODAL ── */
.stats-wrap{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
.stats-header{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.stat-card{
  flex:1;min-width:100px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:10px;padding:12px 14px;text-align:center;
}
.stat-card-num{font-size:26px;font-weight:700;line-height:1;}
.stat-card-lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500;}
.history-item{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:10px;
}
.history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.history-score{font-size:16px;font-weight:700;}
.history-date{font-size:12px;color:var(--text2);}
.history-wrong{font-size:12px;color:var(--text2);line-height:1.6;}
.wrong-tag{
  display:inline-block;background:rgba(255,107,74,0.12);
  color:var(--ster);border-radius:5px;padding:2px 8px;margin:2px;font-size:11px;
}
.no-history{text-align:center;padding:48px 16px;color:var(--text2);}

/* ── SPACED REPETITION ── */
.sr-btns{
  display:flex;gap:8px;width:100%;max-width:500px;
  padding-top:4px;
}
.sr-btn{
  flex:1;padding:12px 8px;border:none;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;min-height:48px;
  transition:all 0.15s;
}
.sr-btn-again{background:rgba(255,107,74,0.15);color:var(--ster);border:1.5px solid rgba(255,107,74,0.3);}
.sr-btn-hard{background:rgba(255,197,66,0.12);color:var(--prob);border:1.5px solid rgba(255,197,66,0.25);}
.sr-btn-good{background:rgba(52,208,140,0.12);color:var(--plan);border:1.5px solid rgba(52,208,140,0.25);}
.sr-btn-easy{background:rgba(74,158,255,0.12);color:var(--alg);border:1.5px solid rgba(74,158,255,0.25);}
.sr-btn:hover,.sr-btn:active{filter:brightness(1.15);}
.sr-due-badge{
  font-size:10px;color:var(--text3);text-align:center;
  padding:2px 0;letter-spacing:0.3px;
}
</style>
</head>

<!-- ══ HEADER ══ -->
<div id="hdr">

    <div class="app-name">📐 ЕГЭ Математика 2026</div>

  </div>
  <div class="srch-row">

</div>

<main id="content"></main>
<button id="bktop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- ══ FLASHCARD MODAL ══ -->
<div class="modal-overlay hidden" id="flash-modal">
  <div class="modal-hdr">
    <div class="modal-title">📚 Карточки <span id="fc-mode-label" style="font-size:11px;color:var(--text2);font-weight:400;"></span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="fc-fav-filter" id="fc-fav-filter" onclick="toggleFavFilter()">⭐ Избранные</button>

      <button class="modal-close" onclick="closeModal('flash-modal')">✕ Закрыть</button>
    </div>
  </div>
  <div class="fc-modal-body">

      <div class="fc-card-inner" id="fc-inner">

          <span class="fc-answer-label">Формула</span>
          <div class="fc-formula" id="fc-formula"></div>
          <div class="fc-hint" id="fc-desc-hint" style="font-size:12px;color:var(--text2);text-align:center;max-width:360px;line-height:1.4;"></div>
        </div>
      </div>

</div>

<div class="modal-overlay hidden" id="test-modal">

  <div class="test-body" id="test-body">

  </div>
</div>

// ─── KaTeX Helper ───
function k(str,disp=false){
  if(!str) return '';

}

// ─── RENDER TABLES ───
function makeTable(type){
  if(type==='trig'){
    const rows=TRIG_TABLE.map(r=>`<tr><td class="ang">${r.a}</td><td>${r.s}</td><td>${r.c}</td><td class="${r.t==='–'?'undef':''}">${r.t}</td><td class="${r.ct==='–'?'undef':''}">${r.ct}</td></tr>`).join('');
    return `<div class="tbl-wrap"><table class="trig-tbl"><thead><tr><th>Угол α</th><th>sin α</th><th>cos α</th><th>tg α</th><th>ctg α</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(type==='deriv'){
    const rows=DERIV_TABLE.map(r=>`<tr><td>${k(r.f)}</td><td>${k(r.d)}</td></tr>`).join('');
    return `<div class="tbl-wrap"><table class="deriv-tbl"><thead><tr><th>f(x)</th><th>f′(x)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(type==='prim'){
    const rows=PRIM_TABLE.map(r=>`<tr><td>${k(r.f)}</td><td>${k(r.p)}</td></tr>`).join('');
    return `<div class="tbl-wrap"><table class="deriv-tbl"><thead><tr><th>f(x)</th><th>∫f(x)dx</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(type==='props'){
    const rows=PROPS_TABLE.map(r=>`<tr><td style="font-family:'Crimson Pro',Georgia;font-weight:600;color:var(--trig)">${r.fn}</td><td>${r.d}</td><td>${r.rng}</td><td>${r.per}</td><td>${r.par}</td><td>${r.zeros}</td></tr>`).join('');

function updateCountdown(){
  // EGE Math Profile 2026: June 2, 2026, 10:00 LOCAL user time
  // new Date(y,m,d,h,min,s) uses browser local timezone automatically
  const ege=new Date(2026,5,2,10,0,0);
  const now=new Date();
  const diff=ege-now;
  const wrap=document.getElementById('countdown-blocks');
  const outer=document.getElementById('countdown-wrap');
  if(!wrap) return;
  if(diff<=0){
    outer.innerHTML='<div style="font-size:13px;color:var(--plan);font-weight:600;padding:6px 0;">🎉 ЕГЭ уже прошёл! Удачи с результатами!</div>';
    return;
  }
  const days=Math.floor(diff/(1000*60*60*24));
  const hrs=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const mins=Math.floor((diff%(1000*60*60))/(1000*60));
  const secs=Math.floor((diff%60000)/1000);
  // Show timezone hint
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const tzHint=tz?` (${tz.split('/').pop().replace('_',' ')})`:'';
  document.querySelector('.countdown-label').textContent=`⏳ До ЕГЭ${tzHint}:`;
  wrap.innerHTML=`
    <div class="countdown-block"><div class="countdown-num">${days}</div><div class="countdown-unit">дней</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-block"><div class="countdown-num">${String(hrs).padStart(2,'0')}</div><div class="countdown-unit">часов</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-block"><div class="countdown-num">${String(mins).padStart(2,'0')}</div><div class="countdown-unit">минут</div></div>
    <div class="countdown-sep">:</div>
    <div class="countdown-block"><div class="countdown-num">${String(secs).padStart(2,'0')}</div><div class="countdown-unit">сек</div></div>
  `;
}

// ─── SMART SEARCH (Russian morphology) ───
function stemRU(w){
  if(w.length<=3) return w;
  return w
    .replace(/(ость|ение|ений|ания|ской|ского|ских|ские|ском)$/,'')
    .replace(/(ого|ему|ому|ее|ие|ые|ой|ий|ый|ая|яя|ая)$/,'')
    .replace(/(ами|ях|ах|ев|ов|ей|ей|ем)$/,'')
    .replace(/(ть|ться|тся|ет|ют|ал|ил|нь)$/,'')
    .replace(/[аеёиоуыьэюя]$/,'');
}
function smartMatch(query,hay){
  const words=query.toLowerCase().split(/\s+/).filter(w=>w.length>=2);
  const hayL=hay.toLowerCase();
  return words.every(w=>{
    if(hayL.includes(w)) return true;          // точное вхождение
    const s=stemRU(w);
    if(s.length>=3&&hayL.includes(s)) return true;  // основа найдена
    // проверяем каждое слово стога по основе запроса
    return hayL.split(/\s+/).some(hw=>stemRU(hw)===s||stemRU(hw).startsWith(s)||s.startsWith(stemRU(hw)));
  });
}
function doSearch(q){
  const qt=q.trim();
  let results=[];
  SECTIONS.forEach(sec=>{
    sec.sub.forEach(sub=>{
      sub.f.forEach((fm,i)=>{
        if(!fm.isTable){
          const hay=`${fm.t} ${fm.d||''} ${sub.n} ${sec.name} ${fm.ep||''} ${fm.es||''}`;
          if(smartMatch(qt,hay)) results.push({fm,secId:sec.id,idx:`${sub.n}-${i}`,secName:sec.name,subName:sub.n});
        }
      });
    });
  });
  let html=`<div id="srch-info">Найдено: <b>${results.length}</b> по запросу «${qt}»</div>`;
  if(!results.length){html+=`<div class="empty"><div class="em">🔍</div><p>Ничего не найдено.<br>Попробуй другой запрос.</p></div>`;}
  else results.forEach(r=>{
    html+=`<div style="font-size:11px;color:${secColor(r.secId)};padding:4px 2px 1px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;">${r.secName} → ${r.subName}</div>`;
    html+=makeCard(r.fm,r.secId,`srch-${r.idx}`);
  });
  document.getElementById('content').innerHTML=html;
}

// ─── AUTO-HIDE HEADER ON SCROLL (smooth, hysteresis) ───
let lastScrollY=window.scrollY,scrollDir=0,accum=0;
window.addEventListener('scroll',()=>{
  const cur=window.scrollY;
  const delta=cur-lastScrollY;
  lastScrollY=cur;
  accum+=delta;
  const hdr=document.getElementById('hdr');
  // Only trigger after 18px accumulated in same direction
  if(accum>18&&cur>80){
    hdr.classList.add('hdr-hidden');
    accum=0;
  } else if(accum<-10){
    hdr.classList.remove('hdr-hidden');
    accum=0;
  }
  // Reset accumulator on direction change
  if(delta>0&&scrollDir<0||delta<0&&scrollDir>0) accum=delta;
  if(delta!==0) scrollDir=delta;
  document.getElementById('bktop').classList.toggle('vis',cur>350);
},{passive:true});

// ══════════════════════════════════════════
// SPACED REPETITION (SM-2 simplified)
// ══════════════════════════════════════════
function srGetCard(id){
  return STATE.sr[id]||{interval:1,ef:2.5,due:0};
}
function srUpdate(id,q){
  // q: 0=again, 3=hard, 4=good, 5=easy
  const c=srGetCard(id);
  let{interval,ef}=c;
  if(q<3){interval=1;} // again
  else{
    if(interval===1) interval=6;
    else if(interval===6) interval=Math.round(interval*ef);
    else interval=Math.round(interval*ef);
    ef=Math.max(1.3,ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
    if(q===5) interval=Math.round(interval*1.3);
  }
  const due=Date.now()+interval*24*60*60*1000;
  STATE.sr[id]={interval,ef,due};
  STATE.save();
  return interval;
}
function srDueCount(){
  const now=Date.now();
  return ALL_FM.filter(e=>STATE.sr[e.id]&&STATE.sr[e.id].due<=now).length;
}
function getSRDueList(){
  const now=Date.now();
  return ALL_FM.filter(e=>{
    const c=srGetCard(e.id);
    return c.due<=now;
  });
}
function toggleSRMode(){
  srMode=!srMode;
  const btn=document.getElementById('sr-mode-btn');
  if(btn) btn.classList.toggle('active',srMode);
  showToast(srMode?`🔁 Умная учёба включена — ${srDueCount()} карточек к повторению сегодня`:'Умная учёба выключена');
}

  if(srMode){

function srRate(q){
  const e=fcList[fcIdx];
  const days=srUpdate(e.id,q);
  const msg=q===0?'Повторим скоро!':`Следующее повторение через ${days} дн.`;
  showToast(msg);
  // Move to next
  fcIdx++;
  if(fcIdx>=fcList.length){
    if(srMode){
      document.getElementById('flash-modal').classList.add('hidden');
      showToast('🎉 Все карточки на сегодня пройдены!');
    } else {fcIdx=fcList.length-1;}
    return;
  }
  fcFlipped=false;
  document.getElementById('fc-scene').classList.remove('flipped');
  updateSRControls(false);
  showFcCard();

function showFcCard(){
  const e=fcList[fcIdx];

  document.getElementById('fc-badge').textContent=e.sec.name+' · '+e.sub.n;
  document.getElementById('fc-badge').style.color=secColor(e.sec.id);
  document.getElementById('fc-question').textContent=e.fm.t;
  document.getElementById('fc-formula').innerHTML=k(e.fm.f,true);
  document.getElementById('fc-desc-hint').textContent=e.fm.d||'';

  document.getElementById('fc-prev').disabled=fcIdx===0;
  document.getElementById('fc-next').disabled=fcIdx===fcList.length-1;

  if(dueBadge) dueBadge.textContent=srMode&&srData.interval>1?`Интервал: ${srData.interval} дн. · Следующее: через ${Math.max(0,daysLeft)} дн.`:'';
}

  fcFavOnly=!fcFavOnly;
  document.getElementById('fc-fav-filter').classList.toggle('active',fcFavOnly);
  fcList=getFcList(); fcIdx=0;
  if(!fcList.length){showToast('Нет избранных!');fcFavOnly=false;document.getElementById('fc-fav-filter').classList.remove('active');fcList=getFcList();}
  showFcCard();
}
// Swipe support
let touchStartX=0;
document.getElementById('flash-modal').addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
document.getElementById('flash-modal').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX;
  if(Math.abs(dx)>60){
    if(srMode&&fcFlipped){srRate(dx>0?4:0);}
    else{dx<0?fcMove(1):fcMove(-1);}
  }
},{passive:true});

// ══════════════════════════════════════════
// TEST MODE (with history)
// ══════════════════════════════════════════
let testQs=[],testIdx=0,testScore=0,testAnswered=false,testWrong=[];
function openTest(){
  const pool=[...ALL_FM].sort(()=>Math.random()-0.5).slice(0,10);
  testQs=pool;testIdx=0;testScore=0;testWrong=[];
  document.getElementById('test-modal').classList.remove('hidden');
  renderTestQ();
}
function renderTestQ(){
  const body=document.getElementById('test-body');
  if(testIdx>=testQs.length){showTestScore();return;}
  const cur=testQs[testIdx];
  const sameSection=ALL_FM.filter(e=>e.sec.id===cur.sec.id&&e.id!==cur.id);
  const wrong=[...sameSection,...ALL_FM.filter(e=>e.id!==cur.id)].sort(()=>Math.random()-0.5).slice(0,3);
  const opts=[cur,...wrong].sort(()=>Math.random()-0.5);
  const pct=Math.round(testIdx/testQs.length*100);
  body.innerHTML=`
    <div class="test-progress-bar"><div class="test-progress-fill" style="width:${pct}%"></div></div>
    <div class="test-q-num">Вопрос ${testIdx+1} из ${testQs.length}</div>
    <div class="test-section-hint" style="color:${secColor(cur.sec.id)}">${cur.sec.name} — ${cur.sub.n}</div>
    <div class="test-formula-wrap">${k(cur.fm.f,true)}</div>
    <div class="test-options">
      ${opts.map(o=>`<button class="test-opt" onclick="answerTest(this,'${o.id}','${cur.id}','${cur.fm.t.replace(/'/g,"\\'")}','${cur.sec.name}')">${o.fm.t}</button>`).join('')}
    </div>
    <button class="test-next-btn hidden" id="test-next" onclick="nextTestQ()">Следующий →</button>
  `;
}
function answerTest(btn,chosen,correct,title,secName){
  if(testAnswered) return;
  testAnswered=true;
  document.querySelectorAll('.test-opt').forEach(b=>{b.disabled=true;});
  if(chosen===correct){btn.classList.add('correct');testScore++;}
  else{
    btn.classList.add('wrong');
    testWrong.push({title,secName});
    document.querySelectorAll('.test-opt').forEach(b=>{
      const t=b.getAttribute('onclick')||'';
      if(t.includes(`'${correct}'`)) b.classList.add('correct');
    });
  }
  document.getElementById('test-next').classList.remove('hidden');
}
function nextTestQ(){testIdx++;testAnswered=false;renderTestQ();}
function showTestScore(){
  const pct=Math.round(testScore/testQs.length*100);
  const msg=pct>=90?'Превосходно! 🏆':pct>=70?'Отличный результат! 🎉':pct>=50?'Хорошо, продолжай! 💪':'Нужно повторить 📚';
  // Save to history
  STATE.testHistory.unshift({
    date:new Date().toLocaleDateString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
    score:testScore,total:testQs.length,
    wrong:testWrong.slice()
  });
  if(STATE.testHistory.length>50) STATE.testHistory=STATE.testHistory.slice(0,50);
  STATE.save();
  const wrongHTML=testWrong.length?`<div style="margin-top:12px;font-size:13px;color:var(--text2);font-weight:600;">Ошибки:</div><div style="margin-top:6px;">${testWrong.map(w=>`<span class="wrong-tag">${w.title}</span>`).join('')}</div>`:'<div style="color:var(--plan);font-size:13px;margin-top:8px;">Ни одной ошибки! 🎯</div>';
  document.getElementById('test-body').innerHTML=`
    <div class="test-score-wrap">
      <div class="test-score-circle">
        <div class="test-score-num">${testScore}/${testQs.length}</div>
        <div class="test-score-label">${pct}%</div>
      </div>
      <div class="test-score-msg">${msg}</div>
      ${wrongHTML}
      <button class="test-restart-btn" onclick="openTest()">🔄 Ещё раз</button>
      <button class="test-restart-btn" onclick="closeModal('test-modal');openStats()">📊 Статистика</button>
      <button class="test-restart-btn" onclick="closeModal('test-modal')">Закрыть</button>
    </div>
  `;
}

// ══════════════════════════════════════════
// STATS
// ══════════════════════════════════════════
function openStats(){
  document.getElementById('stats-modal').classList.remove('hidden');
  renderStats();
}
function renderStats(){
  const wrap=document.getElementById('stats-wrap');
  const hist=STATE.testHistory;
  if(!hist.length){
    wrap.innerHTML=`<div class="no-history"><div style="font-size:40px;margin-bottom:12px">📊</div><div style="font-size:15px;font-weight:600;margin-bottom:8px">Нет данных</div><div style="font-size:13px">Пройди хотя бы один тест!</div></div>`;
    return;
  }
  const total=hist.length;
  const avgScore=Math.round(hist.reduce((a,h)=>a+h.score/h.total*100,0)/total);
  const best=Math.max(...hist.map(h=>Math.round(h.score/h.total*100)));
  const learned=STATE.learned.size;
  // Wrong freq map
  const wrongMap={};
  hist.forEach(h=>h.wrong.forEach(w=>{wrongMap[w.title]=(wrongMap[w.title]||0)+1;}));
  const topWrong=Object.entries(wrongMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const srCount=Object.keys(STATE.sr).length;
  const dueNow=srDueCount();
  wrap.innerHTML=`
    <div class="stats-header">
      <div class="stat-card"><div class="stat-card-num" style="color:var(--alg)">${total}</div><div class="stat-card-lbl">Тестов</div></div>
      <div class="stat-card"><div class="stat-card-num" style="color:var(--plan)">${avgScore}%</div><div class="stat-card-lbl">Средний балл</div></div>
      <div class="stat-card"><div class="stat-card-num" style="color:var(--prob)">${best}%</div><div class="stat-card-lbl">Лучший</div></div>
      <div class="stat-card"><div class="stat-card-num" style="color:var(--trig)">${learned}</div><div class="stat-card-lbl">Выучено</div></div>
    </div>
    ${dueNow>0?`<div style="background:rgba(74,158,255,0.1);border:1px solid rgba(74,158,255,0.25);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;"><b style="color:var(--alg)">🧠 SR-режим:</b> ${dueNow} карточек к повторению сегодня · всего изучено ${srCount}<br><button class="note-save-btn" style="margin-top:8px;" onclick="closeModal('stats-modal');openFlash()">Начать повторение →</button></div>`:''}
    ${topWrong.length?`<div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.7px;">Частые ошибки</div><div style="margin-bottom:18px;">${topWrong.map(([t,c])=>`<span class="wrong-tag">${t} ×${c}</span>`).join('')}</div>`:''}
    <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.7px;">История тестов</div>
    ${hist.map(h=>{
      const p=Math.round(h.score/h.total*100);
      const clr=p>=80?'var(--plan)':p>=60?'var(--prob)':'var(--ster)';
      return `<div class="history-item">
        <div class="history-top">
          <div class="history-score" style="color:${clr}">${h.score}/${h.total} — ${p}%</div>
          <div class="history-date">${h.date}</div>
        </div>
        ${h.wrong.length?`<div class="history-wrong">Ошибки: ${h.wrong.map(w=>`<span class="wrong-tag">${w.title}</span>`).join(' ')}</div>`:'<div style="font-size:12px;color:var(--plan)">Без ошибок ✓</div>'}
      </div>`;
    }).join('')}
    <button style="width:100%;margin-top:12px;background:rgba(255,107,74,0.12);border:1px solid rgba(255,107,74,0.25);color:var(--ster);border-radius:10px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;" onclick="clearHistory()">🗑 Очистить историю</button>
  `;
}
function clearHistory(){
  if(!confirm('Очистить всю историю тестов?')) return;
  STATE.testHistory=[];STATE.save();renderStats();
}

// ─── TABS SCROLL FADE ───
function updateTabsFade(){
  const tabs=document.getElementById('tabs');
  const fade=document.getElementById('tabs-fade');
  if(!tabs||!fade) return;
  const atEnd=tabs.scrollLeft+tabs.clientWidth>=tabs.scrollWidth-8;
  fade.style.opacity=atEnd?'0':'1';
}
setTimeout(()=>{
  const tabs=document.getElementById('tabs');
  if(tabs){tabs.addEventListener('scroll',updateTabsFade,{passive:true});updateTabsFade();}
},100);

// ─── INIT ───
updateFavCount();
applyTheme(STATE.theme);
applyFontSize(STATE.fontSize);
render('algebra');
</script>
</body>
